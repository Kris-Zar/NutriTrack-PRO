services:
  - type: web
    name: nutritrack-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirement.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DEMO_MODE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MONGO_URL
        sync: false
  - type: web
    name: nutritrack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: nutritrack-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
